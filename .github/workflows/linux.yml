name: Linux

on:
  push:
    paths:
      - "linux/**"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "linux/**"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4

      # The system Python, because PyGObject/GTK come from apt (not setup-python).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pytest python3-evdev python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth dbus-x11 dpkg-dev

      - name: Unit tests
        run: python3 -m pytest -v

      - name: Byte-compile everything
        run: python3 -m compileall -q glideball tests

      - name: Import the daemon with real python-evdev
        run: python3 -c "import evdev, glideball.daemon, glideball.__main__; print('evdev', evdev.__name__, 'ok')"

      - name: GUI smoke test (GTK 4 + libadwaita under Xvfb)
        run: xvfb-run -a dbus-run-session -- python3 tests/gui_smoke.py

      - name: CLI smoke test
        run: |
          ./bin/glideball --help
          ./bin/glideball ctl status && exit 1 || echo "no daemon: exits non-zero as expected"

      - name: Lint shell scripts
        run: |
          for f in install.sh uninstall.sh build-tarball.sh build-deb.sh; do bash -n "$f"; done
          sh -n bin/glideball

      - name: Build release tarball and .deb
        run: |
          ./build-tarball.sh
          ./build-deb.sh
          tar tzf dist/glideball-linux-*.tar.gz | grep -q '/install.sh$'
          dpkg-deb --info dist/glideball_*_all.deb

      - uses: actions/upload-artifact@v4
        with:
          name: glideball-linux
          path: linux/dist/*
