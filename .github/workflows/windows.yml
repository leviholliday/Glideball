name: Windows

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      APP_VERSION: "1.0.${{ github.run_number }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Glideball.sln

      - name: Build
        run: dotnet build Glideball.sln -c Release --no-restore -p:Version=$env:APP_VERSION

      - name: Test
        run: >
          dotnet test tests/Glideball.Core.Tests/Glideball.Core.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: windows/TestResults
          if-no-files-found: ignore

      - name: Publish single-file Glideball.exe (x64 and arm64)
        run: |
          foreach ($rid in @("win-x64", "win-arm64")) {
            dotnet publish src/Glideball/Glideball.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true `
              -p:Version=$env:APP_VERSION `
              -o "out/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path "out/$rid/Glideball.exe")) { throw "out/$rid/Glideball.exe is missing" }
          }
          Get-ChildItem out -Recurse | Format-Table FullName, Length

      - name: Zip
        run: |
          foreach ($rid in @("win-x64", "win-arm64")) {
            Compress-Archive -Path "out/$rid/Glideball.exe", "README.md" -DestinationPath "out/Glideball-$rid.zip" -Force
          }

      - name: Installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($arch in @("x64", "arm64")) {
            & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceExe=..\out\win-$arch\Glideball.exe" "/DArch=$arch" installer\Glideball.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload Glideball.exe (x64)
        uses: actions/upload-artifact@v4
        with:
          name: Glideball-win-x64
          path: windows/out/win-x64/Glideball.exe
          if-no-files-found: error

      - name: Upload Glideball.exe (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: Glideball-win-arm64
          path: windows/out/win-arm64/Glideball.exe
          if-no-files-found: error

      - name: Upload zips and installers
        uses: actions/upload-artifact@v4
        with:
          name: Glideball-windows-packages
          path: |
            windows/out/*.zip
            windows/out/Glideball-Setup-*.exe
          if-no-files-found: error
