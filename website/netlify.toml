# Netlify config for the Glide website (static, no build step), plus the
# feedback functions: /api/feedback (from the Mac app and /feedback/),
# /api/admin/* (the admin site's data, reached through its proxy: see
# docs/ADMIN-SITE.md), the app's opt-in stats and crash reports (/api/usage,
# /api/crash), an hourly cleanup, and the download snapshot that fills the
# Statistics page (netlify/functions/stats-snapshot.mjs, scheduled in its own file).

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Short, shareable download link: https://<site>/download is now a page
# (website/download/, built from _pages/download.html) that starts the Mac zip and
# stays with you through Open Anyway. It used to redirect straight to the zip; a
# rule for "/download" would also catch "/download/", so there isn't one any more.
# The previews still redirect straight to their files:
[[redirects]]
  from = "/download/linux"
  to = "https://github.com/leviholliday/glideball/releases/latest/download/Glideball-Linux-Preview.tar.gz"
  status = 302
  force = true

[[redirects]]
  from = "/download/linux-deb"
  to = "https://github.com/leviholliday/glideball/releases/latest/download/Glideball-Linux-Preview.deb"
  status = 302
  force = true

[[redirects]]
  from = "/download/windows"
  to = "https://github.com/leviholliday/glideball/releases/latest/download/Glideball-Windows-Preview-Setup-x64.exe"
  status = 302
  force = true

[[redirects]]
  from = "/download/windows-arm"
  to = "https://github.com/leviholliday/glideball/releases/latest/download/Glideball-Windows-Preview-Setup-arm64.exe"
  status = 302
  force = true

# The admin pages live on their own site now (admin-site/, docs/ADMIN-SITE.md),
# away from the analytics scripts on these pages. Old links keep working:
# /admin/feedback/?id=... goes to .../feedback/?id=... there.
[[redirects]]
  from = "/admin"
  to = "https://admin-glideball.netlify.app/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://admin-glideball.netlify.app/:splat"
  status = 302
  force = true

# The site is published from this folder, so keep what isn't a page out of
# reach: the functions' source and tests, the npm files and node_modules.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# The page sources scripts/build_pages.py builds from (the built pages are what's served).
[[redirects]]
  from = "/_pages/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Security headers for every page.
# - The site's own scripts and styles come from this origin. The only exceptions are the
#   two hashed inline blocks and the Google / Cloudflare analytics hosts that the website
#   analytics notice (a Netlify snippet, set up in the Netlify dashboard) needs. This policy
#   matches what's live; if the snippet changes, its hashes change with it.
# - Links to github.com are plain navigations, which CSP does not restrict.
# - img-src blob: is for the feedback page's previews of the pictures picked.
# - connect-src 'self' covers the feedback page talking to /api/feedback.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-eTEVWQ/0jEWhxJ8zoSNXzg50QYCGNQKgme/7vILkuzI=' https://www.googletagmanager.com/gtag/js https://static.cloudflareinsights.com/beacon.min.js; style-src 'self' 'sha256-oAZ6B7wEYWJct08O9lGynuu8sZwNwUVmwkAutT9KCXI='; img-src 'self' data: blob: https://www.google-analytics.com/g/collect https://region1.google-analytics.com/g/collect; font-src 'self'; connect-src 'self' https://www.google-analytics.com/g/collect https://region1.google-analytics.com/g/collect https://cloudflareinsights.com/cdn-cgi/rum; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# The shared-setup page (/s/#<payload>, docs/SHARE-FORMAT.md). The settings
# live after the #, which browsers never send to the server, and the page reads
# them in the browser. Not for search engines, no Referer to other sites, and
# none of the analytics: the page's own address holds someone's settings, so
# nothing but the site's own files may run there. This second
# policy only narrows the "/*" one (a browser enforces both): no inline scripts,
# no third-party hosts, and no requests at all (connect-src 'none').
[[headers]]
  for = "/s/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

# Images and other static assets: cache for a year.
# These filenames are not content-hashed, so rename a file (e.g. og-v2.png)
# when replacing it, or visitors may keep the old copy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML, CSS and JS: always revalidate so updates show up right away.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
