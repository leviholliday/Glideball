# Netlify config for the Glide website (static, no build step).

[build]
  publish = "."

# Short, shareable download link: https://<site>/download
[[redirects]]
  from = "/download"
  to = "https://github.com/leviholliday/glide/releases/latest/download/Glide.zip"
  status = 301
  force = true

# Security headers for every page.
# - No inline scripts or styles; everything is served from this origin.
# - Links to github.com are plain navigations, which CSP does not restrict.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Images and other static assets: cache for a year.
# These filenames are not content-hashed, so rename a file (e.g. og-v2.png)
# when replacing it, or visitors may keep the old copy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML, CSS and JS: always revalidate so updates show up right away.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
